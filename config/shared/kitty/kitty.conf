include ${KITTY_OS}.conf

cursor_blink_interval 0
cursor_shape block

enable_audio_bell no

shell_integration no-cursor

macos_option_as_alt right

# BEGIN_KITTY_FONTS
font_family      family="Berkeley Mono"
bold_font        family='Berkeley Mono' style=ExtraBold
italic_font      auto
bold_italic_font family='Berkeley Mono' style='ExtraBold Oblique'
# END_KITTY_FONTS

font_size 12.0
